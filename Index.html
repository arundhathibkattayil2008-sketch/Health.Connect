<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏥 HealthConnect</h1>

    <button id="continueButton">
        Continue
    </button>

</body>

</html>
